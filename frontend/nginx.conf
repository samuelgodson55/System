server {
    listen 80;
    server_name localhost;
    server_tokens off;
    # Never build absolute redirects (they would drop the published port, e.g. :3000)
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API to backend. `^~` keeps the static-file rule below from hijacking an /api path.
    location ^~ /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        # A backup or restore can run for minutes; the 60s default cut the request off (504)
        # while the server kept working, so the screen reported a failure that had not happened.
        proxy_read_timeout 300s;
    }

    # Exports are streamed (large ledgers): no buffering, generous timeout.
    # No trailing slash on the location: "/api/exports" (the catalogue) must be proxied
    # directly, not 301-redirected to "/api/exports/" on the wrong port.
    location ^~ /api/exports {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The page shell must never be served stale: its script/style file names change on every
    # release, and an old cached index.html would point at files that no longer exist (blank page).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Build output is content-hashed, so it can be cached for a year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/csv text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
