# Secrets/credentials can be overridden from a `.env` file placed next to this file, e.g.
#   JWT_SECRET=<output of: openssl rand -hex 32>
# The fallbacks below are the previous values, so an existing install keeps working unchanged.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # without a limit, container logs grow until the disk is full
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost only: the database must not be reachable from the network (it used to be, with a
      # well-known password). The API reaches it over Docker's internal network, not this port.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    container_name: inventory-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:-inventory}@postgres:5432/inventory
      JWT_SECRET: ${JWT_SECRET:-inventory-dev-secret-key-change-in-prod}
      JWT_EXPIRES_IN: 7d
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    ports:
      # localhost only: the browser talks to the API through the web container (nginx proxies /api)
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: inventory-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
